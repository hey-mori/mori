[package]
name = "mori"
version = "0.1.0"
description = "Mori desktop shell"
authors = ["Mori"]
license = ""
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
# Native HTTP for local-LLM calls, so Ollama / OpenAI-compatible requests bypass
# the webview CORS preflight that otherwise surfaces as "Failed to fetch".
# rustls avoids a system OpenSSL dependency on Windows.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# The default dev profile uses full debuginfo (`debug = 2`), which on this Tauri
# app produced ~240MB PDBs and a ~10GB target dir that overran a nearly-full
# disk (LNK1318 "unexpected PDB error" is what a disk-full PDB write looks like).
# Line-tables keep panic backtraces and file:line info while cutting the
# debug-info bulk, so the dev build fits and links faster. Raise back to 2 if a
# step-debugger with full locals is needed and disk space allows.
[profile.dev]
debug = "line-tables-only"
