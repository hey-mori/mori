name: Feature
description: Build something new, or connect something already built that a user cannot reach
labels: ["type:feature"]
body:
  - type: textarea
    id: goal
    attributes:
      label: What the user can do afterwards
      description: State the outcome from the user's side, not the implementation.
    validations:
      required: true
  - type: textarea
    id: state
    attributes:
      label: What already exists
      description: >
        Code that is already there and can be reused. Often the only thing
        missing is the wiring.
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: What you must see in the running app for this to be finished.
    validations:
      required: true
  - type: input
    id: milestone
    attributes:
      label: Milestone
      placeholder: M0 Solid ground
