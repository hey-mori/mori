name: Design debt
description: Screens are assembled from different parts and do not read as one product
labels: ["type:design-debt"]
body:
  - type: textarea
    id: divergence
    attributes:
      label: What diverges
      description: How many ways the same concept is implemented. Give a number if you can.
      placeholder: 3 empty-state components, roughly 80 bespoke variants.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: A list of file:line. Count them if they are countable.
    validations:
      required: true
  - type: textarea
    id: target
    attributes:
      label: What to converge on
      description: The one way that becomes canonical. "There isn't one yet" is also an answer.
  - type: textarea
    id: risk
    attributes:
      label: Risk
      description: >
        Is this CSS where source order is load-bearing? Which screens need a
        regression check?
