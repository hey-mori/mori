name: Bug
description: The app misbehaves, leads to a dead end, or renders broken
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What is wrong
      description: What actually happens, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: >
        Which screen, and what you clicked. Say so if it only reproduces with
        real imported data.
      placeholder: |
        1. Open the record ledger
        2. …
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: file:line, logs, screenshots. If it is a guess, say it is a guess.
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options:
        - Desktop (Tauri)
        - Browser dev server
        - Both
        - Not checked
