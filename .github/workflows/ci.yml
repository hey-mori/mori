# Continuous integration.
#
# This workflow deliberately runs `scripts/check.sh --full` rather than listing
# the verification commands itself. That script is also what a contributor runs
# locally, so there is exactly one definition of "verified" and local and CI
# cannot drift apart.
#
# TRIGGER STATE: manual only again, 2026-08-07.
#
# The automatic triggers were restored earlier the same day, on evidence that the
# July billing rejection had cleared: a rejected run re-ran successfully and other
# private repositories here were running CI normally. That was true when measured
# and stopped being true within the hour. Runs are being rejected again -- jobs
# fail in about two seconds with zero steps executed -- after a day of unusually
# heavy use of this account's Actions allowance, macOS minutes included at their
# 10x rate.
#
# So this follows what the restoring change itself asked for: say the date, take
# the triggers back out, and do not leave a red check standing on main.
#
# The gate is `scripts/check.sh`, run locally and recorded in the pull request. A
# hand-started run still works whenever the allowance does.
#
# TO RESTORE: uncomment `push` and `pull_request` once the account's Actions
# billing is settled -- and check that a dispatched run actually executes steps
# first, because a rejection looks like a failure and not like a refusal.
name: ci

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: scripts/check.sh --full
    # Self-hosted on purpose, 2026-09-09. The hosted-runner rejection described
    # at the top of this file is what makes a dispatched run unreliable, and a
    # self-hosted runner is not billed against the Actions allowance at all, so
    # this job can run while the allowance is still settling.
    #
    # The runner is an OCI Ampere box, linux/arm64, registered to this
    # repository only. Labels are `self-hosted, Linux, ARM64, oci-a1, mori` and
    # all five are required, so a future x86 or non-Mori runner in the same
    # account cannot pick this job up by accident.
    #
    # arm64 was checked before the move rather than assumed: package-lock.json
    # carries the linux-arm64 build of every native dependency this job touches
    # (esbuild, rollup, @tailwindcss/oxide, lightningcss, oxc, @tauri-apps/cli),
    # and the connector smoke tests spawn only bash, python3 and git, which the
    # host provides. The macOS and rust-changed jobs are untouched.
    #
    # TO REVERT: put `runs-on: ubuntu-latest` back. Nothing else in this job
    # depends on the runner, and no other job depends on this one.
    runs-on: [self-hosted, Linux, ARM64, oci-a1, mori]
    # A hosted runner that hangs costs minutes; this one holds the only Mori
    # runner there is, so bound it well under the 6h default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # check.sh diffs against the merge base with main to decide scope.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # --no-rust: the macOS job below runs cargo. This runner has no gtk/webkit,
      # so it would fail on a missing system package rather than on the change.
      - run: bash scripts/check.sh --full --no-rust

  # Whether the Rust side is involved at all, so the 10x macOS minutes below are
  # spent when it moves and not otherwise. This job existed in 7030fcd and was
  # dropped a commit later; the comment on `rust` kept describing it, which is why
  # it is back rather than newly invented.
  rust-changed:
    name: rust · changed?
    # Same self-hosted OCI arm64 runner as `verify`, 2026-09-09, and for a
    # sharper reason than saving minutes: while the hosted allowance is
    # rejecting jobs this filter fails before it runs a step, and a failed
    # `needs` skips the macOS job no matter what its `if` says. So the gate
    # that decides whether the Rust side is involved has not been deciding
    # anything. Moving it to a runner that is not billed puts it back in
    # service.
    #
    # Nothing here needs a toolchain: checkout, then git and grep, all of
    # which the host provides. There is one runner, so this job and `verify`
    # take it in turn rather than in parallel; this one is seconds long.
    #
    # TO REVERT: put `runs-on: ubuntu-latest` back.
    runs-on: [self-hosted, Linux, ARM64, oci-a1, mori]
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          # A first push (all-zero before-SHA) or an unreadable base cannot be
          # diffed, so fall back to running the job rather than skipping it.
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" HEAD | grep -qE '^(src-tauri/|\.github/workflows/)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  rust:
    # macOS on purpose: it is the first shipping target and needs no extra
    # system packages for tauri/wry, unlike ubuntu (gtk/webkit dev libs). It
    # also bills at a 10x minute multiplier, so it runs when the Rust side is
    # actually involved -- and on a hand-started run, which is how a clean-room
    # check is asked for.
    name: cargo check · test
    needs: rust-changed
    if: needs.rust-changed.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      # tauri::generate_context! validates frontendDist ("../dist") at compile
      # time, so the web bundle must exist before cargo runs. dist/ is
      # gitignored, so build it here rather than relying on a checked-in copy.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: .
      - run: npm run build
        working-directory: .
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo check --locked
      - run: cargo test --locked
