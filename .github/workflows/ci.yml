# Continuous integration.
#
# This workflow deliberately runs `scripts/check.sh --full` rather than listing
# the verification commands itself. That script is also what a contributor runs
# locally, so there is exactly one definition of "verified" and local and CI
# cannot drift apart.
#
# TRIGGER STATE: automatic, restored 2026-08-07.
#
# It was manual only from 2026-07-24, because runs were being rejected before
# they started ("recent account payments have failed or your spending limit needs
# to be increased"), which put a red X on every commit and taught us to ignore the
# signal. A permanently failing check is worse than an honestly disabled one.
#
# That block has cleared. The rejected run of 2026-07-24 failed with zero steps
# executed; re-run on 2026-08-07 it succeeded with every step running, and other
# private repositories in this organization are running CI on push and
# pull_request again.
#
# `scripts/check.sh` is still what a contributor runs before pushing. What changed
# is that it is no longer the only thing that runs it: docs/git-workflow.md §3
# already required a green CI before merge, and until now nothing could enforce
# that.
#
# Turning these on was held until the gate could pass. It could not: the ubuntu
# job ran cargo where wry has no gtk/webkit, and macOS did not compile at all
# (#67, #70, #71). All three are fixed, and this is switched on against a green
# main rather than in the hope of one.
#
# If runs are ever rejected again, say so here with the date and comment the
# triggers out; do not leave a red check standing.
name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: scripts/check.sh --full
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check.sh diffs against the merge base with main to decide scope.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # --no-rust: the macOS job below runs cargo. This runner has no gtk/webkit,
      # so it would fail on a missing system package rather than on the change.
      - run: bash scripts/check.sh --full --no-rust

  # Whether the Rust side is involved at all, so the 10x macOS minutes below are
  # spent when it moves and not otherwise. This job existed in 7030fcd and was
  # dropped a commit later; the comment on `rust` kept describing it, which is why
  # it is back rather than newly invented.
  rust-changed:
    name: rust · changed?
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          # A first push (all-zero before-SHA) or an unreadable base cannot be
          # diffed, so fall back to running the job rather than skipping it.
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" HEAD | grep -qE '^(src-tauri/|\.github/workflows/)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  rust:
    # macOS on purpose: it is the first shipping target and needs no extra
    # system packages for tauri/wry, unlike ubuntu (gtk/webkit dev libs). It
    # also bills at a 10x minute multiplier, so it runs when the Rust side is
    # actually involved -- and on a hand-started run, which is how a clean-room
    # check is asked for.
    name: cargo check · test
    needs: rust-changed
    if: needs.rust-changed.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      # tauri::generate_context! validates frontendDist ("../dist") at compile
      # time, so the web bundle must exist before cargo runs. dist/ is
      # gitignored, so build it here rather than relying on a checked-in copy.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: .
      - run: npm run build
        working-directory: .
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo check --locked
      - run: cargo test --locked
