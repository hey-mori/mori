# Continuous integration for the app repo (production program W2).
#
# Mirrors the local validation contract (docs/mori-autonomous-loop.md §5):
# typecheck + full Vitest suite, production build, stylelint, knip, and the
# Rust check/test pass when src-tauri is part of the tree. Release packaging
# (signing, notarization, updater artifacts) is a separate workflow that
# lands with W3.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: typecheck · test · build · style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:types
      - run: npm test
      - run: npm run build
      - run: npm run style:check
      # Unused-file inventory. Non-blocking by design (knip.json sets
      # --no-exit-code via the npm script); the log is the audit surface.
      - run: npm run unused

  # Does this change touch the Rust side at all? The cargo job below runs on a
  # macOS runner, which bills at a 10x minute multiplier on a private repo, so
  # spending it on a frontend-only commit is pure waste. This gate is a cheap
  # ubuntu step (1x) that the expensive job depends on.
  rust-changed:
    name: rust · changed?
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          # A first push (all-zero before-SHA) or an unreadable base cannot be
          # diffed, so fall back to running the job rather than skipping it.
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" HEAD | grep -qE '^(src-tauri/|\.github/workflows/)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  rust:
    # macOS runner on purpose: it is the first shipping target and needs no
    # extra system packages for tauri/wry, unlike ubuntu (gtk/webkit dev libs).
    name: cargo check · test
    needs: rust-changed
    if: needs.rust-changed.outputs.changed == 'true'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      # tauri::generate_context! validates frontendDist ("../dist") at compile
      # time, so the web bundle must exist before cargo runs. dist/ is
      # gitignored, so build it here rather than relying on a checked-in copy.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: .
      - run: npm run build
        working-directory: .
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo check --locked
      - run: cargo test --locked
