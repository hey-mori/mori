# Continuous integration.
#
# This workflow deliberately runs `scripts/check.sh --full` rather than listing
# the verification commands itself. That script is also what a contributor runs
# locally, so there is exactly one definition of "verified" and local and CI
# cannot drift apart.
#
# TRIGGER STATE: manual only, on purpose.
#
# The repository is private, and Actions on a private repo is metered. Runs were
# being rejected before they started ("recent account payments have failed or
# your spending limit needs to be increased"), which put a red X on every commit
# and taught us to ignore the signal. A permanently failing check is worse than
# an honestly disabled one, because it hides the real failures among the noise.
#
# So the automatic triggers are commented out rather than deleted, and the real
# gate is `scripts/check.sh`, recorded in each pull request under "How it was
# verified" (docs/git-workflow.md §9).
#
# TO RESTORE: once billing is configured, or the repository becomes public and
# standard runners are free, uncomment the `push` and `pull_request` triggers
# below. Nothing else needs to change.
name: ci

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: scripts/check.sh --full
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check.sh diffs against the merge base with main to decide scope.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash scripts/check.sh --full

  rust:
    # macOS on purpose: it is the first shipping target and needs no extra
    # system packages for tauri/wry, unlike ubuntu (gtk/webkit dev libs). It
    # also bills at a 10x minute multiplier, so it is a separate job that only
    # runs when the Rust side is actually involved.
    name: cargo check · test
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      # tauri::generate_context! validates frontendDist ("../dist") at compile
      # time, so the web bundle must exist before cargo runs. dist/ is
      # gitignored, so build it here rather than relying on a checked-in copy.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: .
      - run: npm run build
        working-directory: .
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo check --locked
      - run: cargo test --locked
