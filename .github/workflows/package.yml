# Windows package.
#
# Builds the NSIS installer that `npm run tauri:build` produces, with the
# browser native host bundled, and uploads it with its SHA-256. This is a build
# for testing an install, not a release: nothing is published and nothing is
# signed, so Windows SmartScreen warns on it.
#
# It runs by hand, and on a pull request that changes how the installer is
# built. Every job runs on a GitHub-hosted runner; see ci.yml for why no job
# may target a self-hosted one.
name: package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/package.yml
      - src-tauri/tauri.conf.json
      - src-tauri/windows/**
      - scripts/prepare-browser-native-host-bundle.mjs
      - connectors/browser-native/**

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: NSIS installer (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run tauri:build
      - name: Checksums
        shell: bash
        run: |
          cd src-tauri/target/release/bundle/nsis
          ls -l
          sha256sum *.exe | tee SHA256SUMS.txt
      - name: The installer registers the browser native host
        shell: bash
        run: grep -q 'nmkjbmmnefgglmkddfokahclckjkldek' src-tauri/windows/nsis/browser-native-host.generated.nsh
      - uses: actions/upload-artifact@v4
        with:
          name: mori-windows-nsis
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
